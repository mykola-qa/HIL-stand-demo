[pytest]
testpaths = tests
addopts = -v --tb=short -ra
pythonpath = .
log_cli = false
log_cli_level = INFO

log_format = %(asctime)s %(levelname)s [%(name)s.%(funcName)s:%(lineno)d]: %(message)s
log_date_format = %d-%m-%Y %H:%M:%S

log_file=pytest.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-8s [%(name)s.%(funcName)s:%(lineno)d]: %(message)s
log_file_date_format = %d-%m-%Y %H:%M:%S

markers =
  hardware: requires DUT CLI (ESP32_PORT or ESP32_HOST)
  power: requires OWON SPM3051 on DUT 5Vin rail
  stim: requires stimulator ESP (STIM_PORT)
  la: requires FX2 logic analyzer (sigrok-cli / fx2lafw) on DUT GPIO2
