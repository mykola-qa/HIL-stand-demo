; Stimulator — ESP32-H2 Super Mini, open-drain pulses for DUT BTN1..BTN4
; H2 needs Arduino 3.x (pioarduino). Official espressif32 6.x Arduino is Xtensa-only.
[env:stim]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-h2-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
